[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-campaign-response"
version = "0.1.0"
description = "A leakage-aware tabular classification workflow for predicting term-deposit subscription from public campaign records."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.scripts]
train-bank-campaign-response = "bank_campaign.train:main"

[tool.setuptools.packages.find]
where = ["src"]
